<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Rath Yatra</title>
<style>
  :root{--saffron:#ea6a12;--deep:#b4400f;--gold:#e0a82e;--ink:#2a1a0f;--muted:#7b6a5c;--line:#ece1d3;--bg:#fbf7f2}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:conic-gradient(from 200deg,var(--gold),var(--saffron),var(--deep),var(--gold))}
  header h1{margin:0;font-size:1rem} nav{display:flex;gap:4px;margin-left:18px}
  nav button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font:600 .88rem inherit;font-family:inherit;color:var(--muted);cursor:pointer}
  nav button[aria-selected=true]{background:#fff3e6;color:var(--deep)}
  .me{margin-left:auto;font-size:.85rem;color:var(--muted);display:flex;gap:10px;align-items:center}
  main{flex:1;display:flex;min-height:0}
  .side{width:420px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fff;min-height:0}
  .bar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
  .list{overflow:auto;flex:1}
  .item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #f4ece2;cursor:pointer;align-items:flex-start}
  .item:hover{background:#fffaf4} .item.sel{background:#fff3e6;box-shadow:inset 3px 0 var(--saffron)}
  .n{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:#fff3e6;color:var(--deep)}
  .item .t{font-weight:600;font-size:.9rem} .item .d{color:var(--muted);font-size:.78rem}
  .tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.68rem;font-weight:700;margin-left:4px;background:#eef2f7;color:#44546a}
  .tag.fired{background:#e5f7ed;color:#137a43} .tag.wait{background:#fff4d6;color:#8a6200} .tag.off{background:#f3f3f3;color:#888}
  form.edit{overflow:auto;flex:1;padding:14px;display:none} form.edit.show{display:block}
  .list.hide{display:none}
  label{display:block;font-size:.76rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:.9rem;background:#fff}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--saffron);border-color:transparent}
  textarea{min-height:70px;resize:vertical} .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.88rem;color:var(--ink);font-weight:500} .check input{width:auto}
  .btn{border:0;border-radius:10px;padding:9px 14px;font:600 .86rem inherit;font-family:inherit;cursor:pointer;background:#f3ece4;color:var(--ink)}
  .btn.p{background:linear-gradient(135deg,var(--saffron),var(--deep));color:#fff} .btn.d{background:#fde8e6;color:#b3261e}
  .btn:disabled{opacity:.5} .grow{flex:1}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:sticky;bottom:-14px;background:#fff;padding:10px 0}
  .hint{font-size:.78rem;color:var(--muted);background:#fffaf2;border:1px dashed #ecd3ad;border-radius:10px;padding:8px 10px;margin-top:10px}
  #map{flex:1} #search{max-width:320px;margin:10px;padding:10px 14px;border-radius:12px;border:0;box-shadow:0 2px 10px #0003;font-size:.9rem}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2433;color:#fff;padding:10px 18px;border-radius:12px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
  .only-place{display:none} form[data-trigger=place] .only-place{display:block} .only-time{display:none} form[data-trigger=time] .only-time{display:block}
  @media (max-width:820px){main{flex-direction:column}.side{width:auto;height:55%;border-right:0;border-bottom:1px solid var(--line)}nav{margin-left:4px}.me span{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">ॐ</div><h1>Rath Yatra admin</h1>
  <nav role="tablist"><button role="tab" aria-selected="true" data-tab="stops">Schedule</button><button role="tab" aria-selected="false" data-tab="alerts">Messages &amp; alerts</button></nav>
  <div class="me"><span id="subs"></span><span id="who"></span><a class="btn" href="/" target="_blank" rel="noopener">View site</a><button class="btn" id="logout">Log out</button></div>
</header>
<main>
  <section class="side">
    <div class="bar"><b class="grow" id="listTitle">Schedule</b><button class="btn p" id="addBtn">+ Add</button></div>
    <div class="list" id="list"></div>

    <form class="edit" id="stopForm">
      <div class="row"><div><label for="s_day">Day</label><input id="s_day" name="day" type="number" min="0" required></div>
        <div><label for="s_date">Date</label><input id="s_date" name="date" type="date" required></div></div>
      <label for="s_halt">Night halt / place</label><input id="s_halt" name="halt" required maxlength="500">
      <div class="row"><div><label for="s_lat">Latitude</label><input id="s_lat" name="lat" type="number" step="any" required></div>
        <div><label for="s_lng">Longitude</label><input id="s_lng" name="lng" type="number" step="any" required></div></div>
      <div class="hint">📍 Click the map or drag the pin to set the location. Use the search box on the map to find a place.</div>
      <label for="s_departure">Departure</label><input id="s_departure" name="departure" maxlength="500">
      <label for="s_via">En-route (via)</label><textarea id="s_via" name="via" maxlength="500"></textarea>
      <label for="s_lunch">Lunch place</label><input id="s_lunch" name="lunch" maxlength="500">
      <label for="s_arrival">Arrival</label><input id="s_arrival" name="arrival" maxlength="500">
      <label for="s_events">Events</label><textarea id="s_events" name="events" maxlength="500"></textarea>
      <label class="check"><input type="checkbox" name="major"> Major Event</label>
      <div class="actions"><button class="btn p">Save</button><button type="button" class="btn" data-cancel>Cancel</button><span class="grow"></span><button type="button" class="btn d" data-del>Delete</button></div>
    </form>

    <form class="edit" id="alertForm" data-trigger="now">
      <label for="a_title">Title</label><input id="a_title" name="title" required maxlength="140" placeholder="e.g. रथ बुटवल आइपुग्दैछ">
      <label for="a_body">Message</label><textarea id="a_body" name="body" maxlength="2000"></textarea>
      <label for="a_image">Image link (optional, https)</label><input id="a_image" name="image" type="url" pattern="https://.*" placeholder="https://…">
      <div class="row">
        <div><label for="a_trigger">When to show</label><select id="a_trigger" name="trigger">
          <option value="now">Now (message)</option><option value="time">At a date &amp; time</option><option value="place">When Rath reaches an area</option></select></div>
        <div><label for="a_show">Show as</label><select id="a_show" name="show_as"><option value="popup">Popup</option><option value="card">Card in सन्देश</option><option value="both">Popup + card</option></select></div>
      </div>
      <div class="only-time"><label for="a_at">Fire at</label><input id="a_at" name="at" type="datetime-local"></div>
      <div class="only-place">
        <div class="row"><div><label for="a_lat">Centre latitude</label><input id="a_lat" name="lat" type="number" step="any"></div>
          <div><label for="a_lng">Centre longitude</label><input id="a_lng" name="lng" type="number" step="any"></div></div>
        <label for="a_radius">Radius (metres)</label><input id="a_radius" name="radius_m" type="number" min="50" max="50000" step="50" value="2000">
        <div class="hint">⭕ Click the map to place the area, drag the circle to move it, drag its edge to resize. Fires when the Rath <b>enters</b> it.</div>
        <label for="a_repeat">Repeat</label><select id="a_repeat" name="repeat"><option value="once">Once</option><option value="daily">Once per day</option><option value="every">Every time it enters</option></select>
      </div>
      <div class="row"><div><label for="a_from">Active from (optional)</label><input id="a_from" name="active_from" type="datetime-local"></div>
        <div><label for="a_until">Active until (optional)</label><input id="a_until" name="active_until" type="datetime-local"></div></div>
      <label class="check"><input type="checkbox" name="push"> 🔔 Also send push notification to subscribed phones</label>
      <label class="check"><input type="checkbox" name="enabled" checked> Enabled</label>
      <div class="actions"><button class="btn p">Save</button><button type="button" class="btn" data-cancel>Cancel</button><button type="button" class="btn" data-fire>Send now</button><span class="grow"></span><button type="button" class="btn d" data-del>Delete</button></div>
    </form>
  </section>
  <div id="map" role="region" aria-label="Map"></div>
</main>
<input id="search" placeholder="Search place…" aria-label="Search place on map">
<div id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let csrf = '', map, tab = 'stops', stops = [], alerts = [], sel = null, pinMarker, circle, stopMarkers = [], circles = [];
const toast = (t) => { $('toast').textContent = t; $('toast').classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('show'), 2500); };
async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'content-type': 'application/json', 'x-csrf': csrf }, body: body && JSON.stringify(body) });
  if (r.status === 401) { location.replace('/login'); throw new Error('login'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.status === 204 || r.status === 201 && !r.headers.get('content-type')?.includes('json') ? null : r.json();
}
// datetime-local <-> ISO (browser local time)
const toLocal = (iso) => { if (!iso) return ''; const d = new Date(iso); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
const toIso = (v) => (v ? new Date(v).toISOString() : null);

// ---- tabs ----
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-selected', x === b));
  tab = b.dataset.tab; closeForm(); render();
});
$('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.replace('/login'); };
$('addBtn').onclick = () => openForm(null);

function render() {
  $('listTitle').textContent = tab === 'stops' ? `Schedule (${stops.length} stops)` : `Messages & alerts (${alerts.length})`;
  if (tab === 'stops') $('list').innerHTML = stops.map((s) => `<div class="item ${sel?.id === s.id ? 'sel' : ''}" data-id="${s.id}" tabindex="0">
      <span class="n">${s.day}</span><div><div class="t">${esc(s.halt)}${s.major ? '<span class="tag wait">Major</span>' : ''}</div><div class="d">${esc(s.date)} · ${esc(s.arrival)}</div></div></div>`).join('');
  else $('list').innerHTML = alerts.length ? alerts.map((a) => {
      const st = !a.enabled ? '<span class="tag off">Off</span>' : a.fired_at ? `<span class="tag fired">Sent ${new Date(a.fired_at).toLocaleString()}</span>` : '<span class="tag wait">Waiting</span>';
      const how = a.trigger === 'now' ? 'Message' : a.trigger === 'time' ? `At ${new Date(a.at).toLocaleString()}` : `Area ${(a.radius_m / 1000).toFixed(1)} km`;
      return `<div class="item ${sel?.id === a.id ? 'sel' : ''}" data-id="${a.id}" tabindex="0"><span class="n">${a.trigger === 'place' ? '⭕' : a.trigger === 'time' ? '⏰' : '💬'}</span>
        <div><div class="t">${esc(a.title)}</div><div class="d">${how}${a.push ? ' · 🔔 push' : ''} ${st}</div></div></div>`; }).join('')
    : '<p class="hint" style="margin:14px">No messages yet. Click “+ Add”.</p>';
  $('list').querySelectorAll('.item').forEach((el) => { el.onclick = () => openForm((tab === 'stops' ? stops : alerts).find((x) => x.id === +el.dataset.id)); el.onkeydown = (e) => e.key === 'Enter' && el.click(); });
  drawMap();
}

// ---- forms ----
const formEl = () => (tab === 'stops' ? $('stopForm') : $('alertForm'));
function openForm(item) {
  sel = item || { id: null };
  const f = formEl();
  f.reset();
  for (const el of f.elements) {
    if (!el.name || !item) continue;
    const v = item[el.name];
    if (el.type === 'checkbox') el.checked = !!v;
    else if (el.type === 'datetime-local') el.value = toLocal(v);
    else el.value = v ?? '';
  }
  if (tab === 'alerts') { f.dataset.trigger = f.trigger.value; if (!item) f.radius_m.value = 2000; }
  f.querySelector('[data-del]').hidden = !item;
  const fire = f.querySelector('[data-fire]'); if (fire) fire.hidden = !item;
  $('list').classList.add('hide'); f.classList.add('show'); $('addBtn').hidden = true;
  if (item?.lat != null && map) map.panTo({ lat: +item.lat, lng: +item.lng });
  drawMap();
}
function closeForm() { sel = null; for (const f of [$('stopForm'), $('alertForm')]) f.classList.remove('show'); $('list').classList.remove('hide'); $('addBtn').hidden = false; drawMap(); }
document.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = () => { closeForm(); render(); });
const formData = (f) => Object.fromEntries([...f.elements].filter((e) => e.name).map((e) => [e.name, e.type === 'checkbox' ? e.checked : e.type === 'datetime-local' ? toIso(e.value) : e.value]));

$('stopForm').onsubmit = async (e) => {
  e.preventDefault();
  try { const d = formData(e.target); if (sel.id) await api(`/api/admin/stops/${sel.id}`, 'PUT', d); else await api('/api/admin/stops', 'POST', d);
    toast('Stop saved'); await load(); closeForm(); render(); } catch (err) { toast('Error: ' + err.message); }
};
$('alertForm').onsubmit = async (e) => {
  e.preventDefault();
  try { const d = formData(e.target); if (sel.id) await api(`/api/admin/alerts/${sel.id}`, 'PUT', d); else await api('/api/admin/alerts', 'POST', d);
    toast(d.trigger === 'now' && d.enabled ? 'Saved and sent' : 'Saved'); await load(); closeForm(); render(); } catch (err) { toast('Error: ' + err.message); }
};
$('alertForm').trigger.onchange = (e) => { $('alertForm').dataset.trigger = e.target.value; drawMap(); };
$('alertForm').radius_m.oninput = (e) => circle && circle.setRadius(+e.target.value || 50);
for (const n of ['lat', 'lng']) $('alertForm')[n].oninput = () => drawMap();
for (const n of ['lat', 'lng']) $('stopForm')[n].oninput = () => drawMap();
document.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
  if (!confirm('Delete this item? This cannot be undone.')) return;
  try { await api(`/api/admin/${tab}/${sel.id}`, 'DELETE'); toast('Deleted'); await load(); closeForm(); render(); } catch (err) { toast('Error: ' + err.message); }
});
document.querySelector('[data-fire]').onclick = async () => {
  if (!confirm('Send this alert to all viewers now' + ($('alertForm').push.checked ? ' and push it to phones?' : '?'))) return;
  try { await api(`/api/admin/alerts/${sel.id}/fire`, 'POST'); toast('Sent'); await load(); render(); } catch (err) { toast('Error: ' + err.message); }
};

// ---- map ----
function setPoint(ll) {
  const f = formEl();
  if (!sel || !f.classList.contains('show')) return;
  if (tab === 'alerts' && f.trigger.value !== 'place') return;
  f.lat.value = ll.lat().toFixed(6); f.lng.value = ll.lng().toFixed(6);
  drawMap();
}
function drawMap() {
  if (!map) return;
  stopMarkers.forEach((m) => m.setMap(null)); circles.forEach((c) => c.setMap(null)); stopMarkers = []; circles = [];
  pinMarker?.setMap(null); circle?.setMap(null); pinMarker = circle = null;
  const f = formEl(), editing = sel && f.classList.contains('show');
  for (const s of stops) {
    if (tab === 'stops' && editing && s.id === sel.id) continue;
    const m = new google.maps.Marker({ map, position: { lat: s.lat, lng: s.lng }, label: { text: String(s.day), color: '#fff', fontSize: '11px', fontWeight: '700' }, opacity: tab === 'stops' ? 1 : .45, title: s.halt });
    if (tab === 'stops') m.addListener('click', () => openForm(s));
    stopMarkers.push(m);
  }
  if (tab === 'alerts') for (const a of alerts) if (a.trigger === 'place' && !(editing && a.id === sel.id))
    circles.push(new google.maps.Circle({ map, center: { lat: a.lat, lng: a.lng }, radius: a.radius_m, strokeColor: '#b4400f', strokeWeight: 1, fillColor: '#ea6a12', fillOpacity: a.enabled ? .12 : .04, clickable: false }));
  if (!editing) return;
  const lat = parseFloat(f.lat.value), lng = parseFloat(f.lng.value);
  if (!isFinite(lat) || !isFinite(lng)) return;
  if (tab === 'stops') {
    pinMarker = new google.maps.Marker({ map, position: { lat, lng }, draggable: true, zIndex: 999, animation: google.maps.Animation.DROP });
    pinMarker.addListener('dragend', (e) => setPoint(e.latLng));
  } else if (f.trigger.value === 'place') {
    circle = new google.maps.Circle({ map, center: { lat, lng }, radius: +f.radius_m.value || 2000, editable: true, draggable: true,
      strokeColor: '#b4400f', strokeWeight: 2, fillColor: '#ea6a12', fillOpacity: .22 });
    circle.addListener('center_changed', () => { const c = circle.getCenter(); f.lat.value = c.lat().toFixed(6); f.lng.value = c.lng().toFixed(6); });
    circle.addListener('radius_changed', () => { f.radius_m.value = Math.min(50000, Math.max(50, Math.round(circle.getRadius() / 50) * 50)); });
  }
}
window.initMap = () => {
  map = new google.maps.Map($('map'), { center: { lat: 28.1, lng: 84.1 }, zoom: 7, gestureHandling: 'greedy', mapTypeControl: false, streetViewControl: false, clickableIcons: false });
  map.addListener('click', (e) => setPoint(e.latLng));
  map.controls[google.maps.ControlPosition.TOP_LEFT].push($('search'));
  if (google.maps.places) {
    const ac = new google.maps.places.Autocomplete($('search'), { componentRestrictions: { country: ['np', 'in'] }, fields: ['geometry', 'name'] });
    ac.addListener('place_changed', () => { const p = ac.getPlace(); if (!p.geometry) return; map.panTo(p.geometry.location); map.setZoom(13); setPoint(p.geometry.location); });
  }
  render();
};

async function load() {
  [stops, alerts] = await Promise.all([fetch('/api/stops').then((r) => r.json()), api('/api/admin/alerts')]);
  api('/api/admin/stats').then((s) => { $('subs').textContent = `🔔 ${s.subscribers} subscribed`; }).catch(() => {});
}
(async () => {
  const me = await api('/api/admin/me'); csrf = me.csrf; $('who').textContent = me.username;
  await load(); render();
  const cfg = await fetch('/api/config').then((r) => r.json());
  if (!cfg.mapsKey) return toast('GOOGLE_MAPS_KEY not set: map picker unavailable');
  const sc = document.createElement('script');
  sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(cfg.mapsKey)}&libraries=places&callback=initMap`;
  sc.async = true; document.head.appendChild(sc);
})();
</script>
</body>
</html>
